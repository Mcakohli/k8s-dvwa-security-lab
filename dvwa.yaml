apiVersion: v1
kind: Namespace
metadata:
  name: dvwa-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa-deployment
  namespace: dvwa-lab
  labels:
    app: dvwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
    spec:
      containers:
      - name: dvwa
        image: vulnerables/web-dvwa:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa-service
  namespace: dvwa-lab
spec:
  type: NodePort
  selector:
    app: dvwa
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http